
services:
  api:
    build:
      context: ./api
    container_name: fermec-api
    ports:
      - "8000:8000"
    volumes:
      - fermec_data:/data
      - ./input:/input:ro
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: fermec-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  ceviri-servisi:
    build:
      context: ./ceviri-servisi
    container_name: fermec-ceviri-servisi
    ports:
      - "8001:8001"
    environment:
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./reports/api_data:/app/data
    restart: unless-stopped







volumes:
  n8n_data:
  fermec_data:
